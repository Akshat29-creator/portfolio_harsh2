services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: harsh-portfolio
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: portfolio-tunnel
    command: tunnel --url http://portfolio:3000
    depends_on:
      - portfolio
    restart: unless-stopped
